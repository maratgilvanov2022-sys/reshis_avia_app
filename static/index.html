<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решись Авиа — Прогнозирование спроса</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>Решись Авиа</h1>
                    <p class="subtitle">Инструмент расчёта спроса и прогноза продаж билетов</p>
                </div>
                <div id="user-panel" class="user-panel hidden">
                    <span id="user-greeting" class="user-name"></span>
                    <button type="button" id="logout-btn" class="btn-secondary">Выйти</button>
                </div>
            </div>
        </header>

        <!-- Блок авторизации и регистрации -->
        <section id="auth-section" class="card auth-card">
            <div class="tabs">
                <button type="button" id="tab-login" class="tab-btn active">Вход в систему</button>
                <button type="button" id="tab-register" class="tab-btn">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Логин</label>
                    <input type="text" id="login-username" required placeholder="Введите логин">
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" required placeholder="Введите пароль">
                </div>
                <button type="submit">Войти</button>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="reg-fullname">ФИО или должность сотрудника</label>
                    <input type="text" id="reg-fullname" required placeholder="Например, Гильванов Марат">
                </div>
                <div class="form-group">
                    <label for="reg-username">Логин (минимум 3 символа)</label>
                    <input type="text" id="reg-username" required minlength="3" placeholder="Придумайте логин">
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль (минимум 4 символа)</label>
                    <input type="password" id="reg-password" required minlength="4" placeholder="Придумайте пароль">
                </div>
                <button type="submit">Зарегистрироваться и войти</button>
            </form>

            <div id="auth-error" class="error hidden"></div>
        </section>

        <!-- Основной рабочий кабинет (прогнозирование) -->
        <main id="app-section" class="hidden">
            <section class="card form-section">
                <h2>Параметры рейса</h2>
                <form id="forecast-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="origin-select">Откуда</label>
                            <select id="origin-select" required>
                                <option value="" disabled selected>Загрузка...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="destination-select">Куда</label>
                            <select id="destination-select" required>
                                <option value="" disabled selected>Загрузка...</option>
                            </select>
                        </div>
                    </div>
                    <small id="price-hint" class="hint" style="margin-top: -8px; margin-bottom: 16px;"></small>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="date-input">Дата вылета</label>
                            <input type="date" id="date-input" required min="2026-06-01" max="2026-07-01" value="2026-06-01">
                        </div>

                        <div class="form-group">
                            <label for="price-input">Цена билета (₽)</label>
                            <input type="number" id="price-input" min="100" step="100" required placeholder="Например, 9000">
                        </div>
                    </div>

                    <button type="submit" id="submit-btn">Рассчитать прогноз</button>
                </form>
                <div id="error-message" class="error hidden"></div>
            </section>

            <section id="results-section" class="card results-section hidden">
                <h2 id="result-title">Результаты прогноза</h2>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Всего мест в самолёте</span>
                        <span class="metric-value" id="seats-value">—</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Желают купить (медиана)</span>
                        <span class="metric-value" id="demand-value">—</span>
                    </div>
                    <div class="metric-card highlight">
                        <span class="metric-label">Прогноз продаж (купят)</span>
                        <span class="metric-value" id="sales-value">—</span>
                    </div>
                </div>

                <div id="capacity-alert" class="alert hidden"></div>

                <div class="chart-container">
                    <h3>Распределение спроса по сценариям (квантили 0.1 – 0.9)</h3>
                    <canvas id="demandChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
